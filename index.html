<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omar</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23242B7B'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (e) { var t = 'dark'; }
  document.documentElement.classList.add(t);
  document.documentElement.style.colorScheme = t;
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff;
    --fg: #0a0a0a;
    --brand: #242B7B;
    --ease: cubic-bezier(.44, 0, .56, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  .dark {
    --bg: #000;
    --fg: #fafafa;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    min-height: 100dvh;
    color: var(--fg);
    font-family: Geist, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  main { padding: 56px 24px 0; }
  @media (min-width: 640px) { main { padding: 56px 64px 0; } }
  header { display: flex; align-items: center; gap: 12px; }
  h1 {
    margin: 0;
    font-size: 25px;
    line-height: 31px;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--brand);
  }
  .bracket {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin: -6px 0;
    padding: 0 2px;
    background: none;
    border: 0;
    border-radius: 4px;
    color: var(--fg);
    font: 500 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .4s var(--ease-out);
  }
  .bracket::before, .bracket::after {
    color: color-mix(in srgb, currentColor 45%, transparent);
    transition: color .3s var(--ease);
  }
  .bracket::before { content: "["; margin-right: .15em; }
  .bracket::after { content: "]"; margin-left: .15em; }
  .bracket:hover::before, .bracket:hover::after,
  .bracket:active::before, .bracket:active::after { color: var(--brand); }
  .bracket:active { transform: scale(.95); transition-duration: 80ms; }
  .bracket:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .bracket svg { width: 14px; height: 14px; }
  .moon { display: none; }
  .dark .sun { display: none; }
  .dark .moon { display: block; }
</style>
</head>
<body>
  <main>
    <header>
      <h1>omar</h1>
      <button type="button" class="bracket" id="theme" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </button>
    </header>
  </main>
  <script>
    document.getElementById('theme').addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.classList.contains('dark') ? 'light' : 'dark';
      root.classList.remove('light', 'dark');
      root.classList.add(next);
      root.style.colorScheme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
